<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Optimizer Trip Planner">
  <!-- The product's own picture, at 16px: a route with stops on it. Drawn rather
       than fetched, because `WF-034` keeps this app working with no network, and a
       favicon that 404s offline is the one asset nobody notices is missing until
       the tab strip is full of blank pages.

       House red, which is the no-destination accent (D3). It does not follow the
       destination accent: a favicon is the app, not the trip, and a tab icon that
       changed colour per trip would stop being a way to find this tab. -->
  <rect width="32" height="32" rx="4" fill="#a30000"/>
  <path d="M6 22 C 11 22, 12 12, 17 12 S 23 17, 26 11"
        fill="none" stroke="#fdf6ee" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="0.1 5"/>
  <circle cx="6" cy="22" r="3.4" fill="#fdf6ee"/>
  <circle cx="26" cy="11" r="3.4" fill="#d4832f"/>
</svg>
