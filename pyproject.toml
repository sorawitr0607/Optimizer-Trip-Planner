[project]
name = "tourist-planner"
version = "0.1.0"
description = "Local, evidence-aware personal travel planner"
license = { text = "MIT" }
requires-python = ">=3.12"
# One. `xlsxwriter` exists only because slice 5 renders a workbook. Streamlit
# went with the POC at S6; the local API is a stdlib ThreadingHTTPServer and the
# browser dependencies live in web/package.json.
dependencies = [
    "xlsxwriter>=3.2.9",
]

# Development only, for gates, never for the app. `pillow` reads the screen
# baselines. It used to arrive transitively via streamlit, so declaring it is
# what kept the baseline gate working when the POC went.
[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pillow>=11",
    "psycopg[binary]>=3.3.4",
]

[tool.uv]
package = false
