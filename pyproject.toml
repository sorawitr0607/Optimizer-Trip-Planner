[project]
name = "tourist-planner"
version = "0.1.0"
description = "Local, evidence-aware personal travel planner"
license = { text = "MIT" }
requires-python = ">=3.12"
# `xlsxwriter` exists only because slice 5 renders a workbook. Streamlit went with
# the POC at S6; the local API is a stdlib ThreadingHTTPServer and the browser
# dependencies live in web/package.json.
#
# The two psycopg lines are the hosted deployment, and they are here rather than
# only in requirements.txt because Vercel reads this file. Which of the two it
# installs from is not something this repo controls, so both list the same three
# packages; a deployment that installs from the wrong one and finds no driver
# fails at the first request, not at build time. Running locally still touches
# none of it -- `open_store` returns SQLite unless TOURIST_DB_URL is set.
dependencies = [
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "xlsxwriter>=3.2.9",
]

# Development only, for gates, never for the app. `pillow` reads the screen
# baselines. It used to arrive transitively via streamlit, so declaring it is
# what kept the baseline gate working when the POC went.
[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pillow>=11",
]

[tool.uv]
package = false

# Do not add a `tool.vercel` entrypoint to this file. Declaring one puts the
# project into Vercel's framework-preset mode, and the documentation is explicit
# about what that means: "Vercel then runs your app as Vercel Functions and routes
# every request to it." Every request means every request -- /, /favicon.svg and
# the stylesheet included -- so the built frontend is never served and the whole
# site answers 500. It has been added twice now, once by me and once by a v0 pull
# request, because the build error suggests it. The build error is about this
# file; a blank site is what it costs. api/ holds one function file, and Vercel
# maps that by path without being told.
